name: Sync to Hugging Face Hub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Replace 'YOUR_HF_USERNAME/YOUR_SPACE_NAME' with your actual Space URL below
          # Example: git remote add space https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/HF_USERNAME/MediSight
          git remote add space https://genAI71:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/genAI71/Medisight
          
          # Force push to the 'main' branch of the Hugging Face Space
          git push --force space main
